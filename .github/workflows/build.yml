name: Build Windows Portable

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 准备 Flutter 稳定版环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 保护代码并生成免安装绿色版
        shell: pwsh
        run: |
          # 1. 先把你的真实业务代码与依赖文件备份到临时位置
          Copy-Item "lib/main.dart" "main_backup.dart"
          Copy-Item "pubspec.yaml" "pubspec_backup.yaml"

          # 2. 生成 Windows 原生底层工程（即使它生成了默认Demo也没关系）
          flutter create --platforms=windows .

          # 3. 强制把你的真实代码还原回去，绝不被默认计数器冲掉！
          Move-Item -Force "main_backup.dart" "lib/main.dart"
          Move-Item -Force "pubspec_backup.yaml" "pubspec.yaml"

          # 4. 获取依赖与编译 Windows 原生可执行程序
          flutter pub get
          flutter build windows --release

          # 5. 打包为免安装绿色便携 zip 压缩包
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "tts_reader_portable.zip"

      - name: 上传免安装绿色包
        uses: actions/upload-artifact@v4
        with:
          name: tts_reader_portable_win10
          path: tts_reader_portable.zip
