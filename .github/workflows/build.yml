name: Build Windows Portable App

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出云端仓库
        uses: actions/checkout@v4

      - name: 配置 Flutter 官方环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 自适应校准工程并生成 Windows 底层
        shell: pwsh
        run: |
          # 1. 自动容错：如果在网页端直接建在根目录的 main.dart，自动移入 lib/ 目录
          if (-not (Test-Path "lib")) {
              New-Item -ItemType Directory -Force -Path "lib"
          }
          if (Test-Path "main.dart") {
              Move-Item -Force "main.dart" "lib/main.dart"
              Write-Host "已自动将根目录的 main.dart 校准至 lib/main.dart"
          }

          # 2. 在临时目录生成 Windows 原生工程，仅提取 windows 文件夹，绝不触碰你的代码
          flutter create --platforms=windows temp_gen
          Copy-Item -Recurse -Force "temp_gen/windows" "windows"
          Remove-Item -Recurse -Force "temp_gen"

          # 3. 安装依赖并编译 Windows 绿色便携版
          flutter pub get
          flutter build windows --release

          # 4. 打包为绿色免安装 zip 压缩包
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "tts_reader_portable.zip"

      - name: 上传便携免安装包
        uses: actions/upload-artifact@v4
        with:
          name: tts_reader_portable_win10
          path: tts_reader_portable.zip
